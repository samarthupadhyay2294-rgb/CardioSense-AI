services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/ptbxl_cnn_best.pt
      - DATABASE_URL=postgresql://cardiosense:cardiosense@db:5432/cardiosense
      - CORS_ORIGINS=http://localhost:5173
      - MAX_UPLOAD_SIZE_MB=20
      - MODEL_VERSION=1.0
    volumes:
      - ./backend/models:/app/models
      - ./backend/config:/app/config
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cardiosense
      - POSTGRES_PASSWORD=cardiosense
      - POSTGRES_DB=cardiosense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
